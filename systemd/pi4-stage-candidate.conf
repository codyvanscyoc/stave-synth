# Reversible Pi4 stage-candidate override.
#
# DO NOT install this blindly or copy it from the generic installer. Use it
# only after the isolated startup probe, backups and off-stage authorization.
# Install as exactly:
#   ~/.config/systemd/user/stave-synth.service.d/90-pi4-stage-candidate.conf
# Roll back by disabling/removing only that exact installed file, running
# `systemctl --user daemon-reload`, and starting the preserved service source.
# The base unit continues to own Type=notify, watchdog/restart and stop policy.
[Service]
# Replace both inherited pre-start commands. The candidate performs only a
# bounded readiness probe; it never changes a global ALSA mixer.
ExecStartPre=
ExecStartPre=/usr/bin/timeout 5 /bin/sh -c 'until pw-cli i 0 >/dev/null 2>&1; do sleep 0.3; done'

# Run the candidate checkout with the already-installed live virtualenv.
# Clearing ExecStart is required before replacing the base unit's command.
ExecStart=
ExecStart=/usr/bin/pw-jack %h/stave-synth/venv/bin/python -m stave_synth.main --no-gui
WorkingDirectory=%h/stave-synth-pi4-stage

# A stage service must never inherit a disposable test identity from the user
# manager. Production paths, ports and JACK name remain the runtime defaults.
Environment=STAVE_INSTANCE=stage
UnsetEnvironment=STAVE_INSTANCE_ROOT STAVE_HTTP_PORT STAVE_WEBSOCKET_PORT

# Complete, explicit Pi4 stage-native profile. Strict readiness prevents a
# quiet fallback to an unqualified Python path after an incomplete deployment.
Environment=STAVE_LOW_RAM=1
Environment=STAVE_FAUST_REVERB=1
Environment=STAVE_FAUST_PING_PONG=1
Environment=STAVE_FAUST_OSC_BANK=1
Environment=STAVE_FAUST_SYMPATHETIC=1
Environment=STAVE_FAUST_MASTER_FX=1
Environment=STAVE_FAUST_BUS_COMP=1
Environment=STAVE_FAUST_ORGAN=1
Environment=STAVE_FAUST_PAD_BUS=1
Environment=STAVE_FAUST_PIANO_CHAIN=1
Environment=STAVE_FAUST_MERGED=1
Environment=STAVE_REQUIRE_NATIVE=1
